# Deploy the built static site to GitHub Pages.
# NOTE: staged at workflows-staging/ due to token scope limits.
# Move this file to .github/workflows/pages-deploy.yml to activate.
name: pages-deploy

on:
  push:
    branches: [main]
    paths: [site/**]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
